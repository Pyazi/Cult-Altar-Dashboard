name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole `
            --icon="cult_altar.ico" `
            --name="CultAltar-Windows" `
            --add-data "index.html;." `
            --add-data "cult_altar.ico;." `
            --add-data "languages.json;." `
            --add-data "cult_preset.json;." `
            PC_Editor.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: CultAltar-Windows
          path: dist/CultAltar-Windows.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux / SteamOS
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system libraries for PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-sync1 libgl1-mesa-glx libegl1 libpulse0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole \
            --icon="cult_altar.ico" \
            --name="CultAltar-Linux" \
            --add-data "index.html:." \
            --add-data "cult_altar.ico:." \
            --add-data "languages.json:." \
            --add-data "cult_preset.json:." \
            PC_Editor.py
          chmod +x dist/CultAltar-Linux

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: CultAltar-Linux
          path: dist/CultAltar-Linux
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: CultAltar-Windows
          path: release_assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: CultAltar-Linux
          path: release_assets

      - name: Make Linux binary executable
        run: chmod +x release_assets/CultAltar-Linux

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/CultAltar-Windows.exe
            release_assets/CultAltar-Linux
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Cult Altar Dashboard {0}', github.ref_name) || 'Cult Altar Dashboard (Latest Release)' }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
