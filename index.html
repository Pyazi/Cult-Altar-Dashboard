<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Алтарь ПК">
    <title>Алтарь ПК</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        input {
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b090b;
            color: #f2ebd9;
            font-family: Georgia, "Times New Roman", serif;
            overflow: hidden;
        }

        /* Экран подключения */
        #setup {
            padding: 18px 20px;
            text-align: center;
            height: 100%;
            background: radial-gradient(circle, #24191e 0%, #0d0a0d 100%);
        }
        #setup h2 {
            color: #d92b2b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 5px 0;
            font-size: 20px;
            text-shadow: 0 2px 6px rgba(217, 43, 43, 0.5);
        }
        #setup p {
            color: #b8ad9e;
            font-size: 13px;
            margin: 4px 0 8px 0;
        }
        #detected-host {
            display: inline-block;
            color: #e6b800;
            background-color: #1c171c;
            border: 1px dashed #8a1c1c;
            padding: 4px 12px;
            font-size: 13px;
            margin-bottom: 10px;
            border-radius: 3px;
        }
        .input-row { margin-bottom: 10px; }
        #pin-code {
            padding: 10px;
            font-size: 22px;
            width: 150px;
            border-radius: 3px;
            border: 2px solid #e6b800;
            background-color: #1c171c;
            color: #e6b800;
            font-family: Georgia, serif;
            font-weight: bold;
            letter-spacing: 4px;
            text-align: center;
            -webkit-appearance: none;
        }

        button.main-btn {
            padding: 11px 16px;
            font-size: 15px;
            margin: 5px;
            border-radius: 3px;
            border: 2px solid #e6b800;
            background-color: #8a1c1c;
            color: #f2ebd9;
            font-family: Georgia, serif;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 88%;
            max-width: 310px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
        }
        .secondary-btn {
            background-color: #241d24 !important;
            border-color: #6e5d6e !important;
            color: #d4c8b8 !important;
        }

        /* Экран сна */
        #sleep-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1f1216 0%, #070507 100%);
            z-index: 999;
            text-align: center;
            padding-top: 12vh;
        }
        .ritual-ring {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            border: 2px dashed #8a1c1c;
            border-radius: 50%;
            box-shadow: 0 0 18px rgba(217, 43, 43, 0.3);
            will-change: transform;
            -webkit-animation: spinRing 14s linear infinite;
            animation: spinRing 14s linear infinite;
        }
        .ritual-ring::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid #e6b800;
            border-radius: 50%;
            opacity: 0.6;
        }
        .crown-core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            margin-left: -40px;
            margin-top: -40px;
            line-height: 80px;
            font-size: 46px;
            color: #d92b2b;
            will-change: transform, opacity;
            -webkit-animation: pulseCrown 2.6s ease-in-out infinite;
            animation: pulseCrown 2.6s ease-in-out infinite;
        }
        .sleep-title {
            font-size: 18px;
            letter-spacing: 3px;
            color: #d92b2b;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .sleep-sub {
            font-size: 13px;
            color: #8f8275;
            letter-spacing: 1px;
        }
        .sleep-clock {
            margin-top: 18px;
            font-size: 28px;
            color: #d4c8b8;
            letter-spacing: 2px;
            opacity: 0.75;
        }

        @-webkit-keyframes spinRing {
            0% { -webkit-transform: rotate(0deg) translateZ(0); }
            100% { -webkit-transform: rotate(360deg) translateZ(0); }
        }
        @keyframes spinRing {
            0% { transform: rotate(0deg) translateZ(0); }
            100% { transform: rotate(360deg) translateZ(0); }
        }
        @-webkit-keyframes pulseCrown {
            0%, 100% { -webkit-transform: scale(0.92) translateZ(0); opacity: 0.65; }
            50% { -webkit-transform: scale(1.08) translateZ(0); opacity: 1; }
        }
        @keyframes pulseCrown {
            0%, 100% { transform: scale(0.92) translateZ(0); opacity: 0.65; }
            50% { transform: scale(1.08) translateZ(0); opacity: 1; }
        }

        /* Внешний контейнер панели и аппаратно ускоренный холст */
        #dashboard-wrapper {
            display: none;
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #0b090b;
            overflow: hidden;
        }
        #dashboard {
            position: absolute;
            width: 640px;
            height: 360px;
            background-color: #141014;
            background-image: 
                radial-gradient(circle at center, transparent 40%, #080608 100%),
                radial-gradient(#2e2226 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px;
            transform-origin: top left;
            -webkit-transform-origin: top left;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* Карточка виджета */
        .cult-card {
            position: absolute;
            background-color: #1c171c;
            border: 2px solid #8a1c1c;
            box-shadow: 
                inset 0 0 0 2px #120f12,
                inset 0 0 0 3px #4a151b,
                0 3px 6px rgba(0, 0, 0, 0.75);
            padding: 6px 10px;
            border-radius: 2px;
            overflow: hidden;
            z-index: 1;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        .cult-card::before, .cult-card::after {
            content: "◆";
            position: absolute;
            font-size: 8px;
            color: #e6b800;
            line-height: 1;
            z-index: 2;
        }
        .cult-card::before { top: 2px; left: 3px; }
        .cult-card::after { bottom: 2px; right: 3px; }

        .card-header {
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 3px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-value {
            font-weight: bold;
            color: #f2ebd9;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-clock { border-color: #d4c8b8; }
        .card-clock .card-header { color: #d92b2b; }

        .card-cpu { border-color: #d92b2b; }
        .card-cpu .card-header { color: #ff4d4d; }

        .card-ram { border-color: #e6b800; }
        .card-ram .card-header { color: #e6b800; }

        .card-disk { border-color: #b366ff; }
        .card-disk .card-header { color: #b366ff; }

        .card-uptime { border-color: #66d9ff; }
        .card-uptime .card-header { color: #66d9ff; }

        .card-launcher {
            background-color: #2b1419;
            border: 2px solid #e6b800;
            cursor: pointer;
        }
        .card-launcher:active {
            transform: scale(0.95) translateZ(0);
            -webkit-transform: scale(0.95) translateZ(0);
            background-color: #591622;
        }
        .card-launcher .card-header { color: #e6b800; }

        .card-image {
            padding: 4px;
            background-color: #161216;
            border-color: #8a1c1c;
            display: flex;
            display: -webkit-flex;
            align-items: center;
            -webkit-align-items: center;
            justify-content: center;
            -webkit-justify-content: center;
        }
        .card-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
        }

        .card-spotify {
            background-color: #152119;
            border-color: #1db954;
            display: flex;
            display: -webkit-flex;
            flex-direction: column;
            -webkit-flex-direction: column;
            justify-content: space-between;
            -webkit-justify-content: space-between;
        }
        .card-spotify .card-header { color: #1db954; }
        .spotify-track {
            color: #f2ebd9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: bold;
        }

        .card-volume {
            border-color: #ff9933;
            display: flex;
            display: -webkit-flex;
            flex-direction: column;
            -webkit-flex-direction: column;
            justify-content: space-between;
            -webkit-justify-content: space-between;
        }
        .card-volume .card-header { color: #ff9933; }

        .media-row {
            display: flex;
            display: -webkit-flex;
            justify-content: space-between;
            -webkit-justify-content: space-between;
            align-items: center;
            -webkit-align-items: center;
            width: 100%;
            height: 54%;
        }
        .card-volume .media-row { height: 66%; }
        .mini-btn {
            background-color: #241d24;
            border: 1px solid #8a1c1c;
            color: #f2ebd9;
            width: 31%;
            height: 100%;
            border-radius: 3px;
            font-weight: bold;
            display: flex;
            display: -webkit-flex;
            align-items: center;
            -webkit-align-items: center;
            justify-content: center;
            -webkit-justify-content: center;
        }
        .mini-btn:active {
            background-color: #8a1c1c;
            transform: scale(0.92);
            -webkit-transform: scale(0.92);
        }
        .spotify-btn { border-color: #1db954; }
        .spotify-btn:active { background-color: #1db954; color: #000; }
        .vol-btn { border-color: #ff9933; }
        .vol-btn:active { background-color: #ff9933; color: #000; }

        .bar-track {
            width: 100%;
            background-color: #0d0a0d;
            border: 1px solid #4a3f4a;
            margin-top: 5px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.35s ease-out;
            -webkit-transition: width 0.35s ease-out;
        }
        .fill-cpu { background-color: #d92b2b; }
        .fill-ram { background-color: #e6b800; }
        .fill-disk { background-color: #b366ff; }

        /* --- ОВЕРЛЕЙ ЗНАМЕНИЙ --- */
        #notify-overlay {
            position: absolute;
            z-index: 900;
            pointer-events: none;
            display: flex;
            display: -webkit-flex;
            align-items: center;
            -webkit-align-items: center;
            justify-content: center;
            -webkit-justify-content: center;
            opacity: 0;
            will-change: transform, opacity;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        .omen-badge {
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle, #2b1419 25%, #120f12 85%);
            border: 2px solid #d92b2b;
            box-shadow: 
                inset 0 0 0 3px #120f12,
                inset 0 0 0 4px #8a1c1c,
                0 0 14px rgba(217, 43, 43, 0.85);
            display: flex;
            display: -webkit-flex;
            align-items: center;
            -webkit-align-items: center;
            justify-content: center;
            -webkit-justify-content: center;
            padding: 19%;
            flex-shrink: 0;
            -webkit-flex-shrink: 0;
        }
        .omen-badge::before, .omen-badge::after {
            content: "◆";
            position: absolute;
            font-size: 9px;
            color: #e6b800;
            line-height: 1;
        }
        .omen-badge::before { top: -5px; left: 50%; margin-left: -4px; }
        .omen-badge::after  { bottom: -5px; left: 50%; margin-left: -4px; }

        .omen-telegram { border-color: #d92b2b; }
        .omen-discord  { border-color: #e6b800; }
        .omen-steam    { border-color: #d4c8b8; }

        .omen-active {
            -webkit-animation: omenBlink5s 5s ease-in-out forwards;
            animation: omenBlink5s 5s ease-in-out forwards;
        }
        @-webkit-keyframes omenBlink5s {
            0%   { opacity: 0; -webkit-transform: scale(0.75) translateZ(0); }
            12%  { opacity: 1; -webkit-transform: scale(1.05) translateZ(0); }
            25%  { opacity: 0.35; -webkit-transform: scale(0.95) translateZ(0); }
            40%  { opacity: 1; -webkit-transform: scale(1.05) translateZ(0); }
            55%  { opacity: 0.35; -webkit-transform: scale(0.95) translateZ(0); }
            70%  { opacity: 1; -webkit-transform: scale(1.03) translateZ(0); }
            85%  { opacity: 0.85; -webkit-transform: scale(1.0) translateZ(0); }
            100% { opacity: 0; -webkit-transform: scale(0.8) translateZ(0); }
        }
        @keyframes omenBlink5s {
            0%   { opacity: 0; transform: scale(0.75) translateZ(0); }
            12%  { opacity: 1; transform: scale(1.05) translateZ(0); }
            25%  { opacity: 0.35; transform: scale(0.95) translateZ(0); }
            40%  { opacity: 1; transform: scale(1.05) translateZ(0); }
            55%  { opacity: 0.35; transform: scale(0.95) translateZ(0); }
            70%  { opacity: 1; transform: scale(1.03) translateZ(0); }
            85%  { opacity: 0.85; transform: scale(1.0) translateZ(0); }
            100% { opacity: 0; transform: scale(0.8) translateZ(0); }
        }

        /* --- СТИЛИ ДЛЯ ТЕМЫ STARDEW VALLEY --- */
        body.theme-stardew {
            background-color: #26190e;
            color: #f7ebd2;
            font-family: Georgia, "Times New Roman", serif;
        }
        body.theme-stardew #setup {
            background: radial-gradient(circle, #3d2716 0%, #1c120a 100%);
        }
        body.theme-stardew #setup h2 {
            color: #ffd966;
            text-shadow: 0 2px 6px rgba(255, 217, 102, 0.4);
        }
        body.theme-stardew #detected-host {
            background-color: #332014;
            border-color: #8c5826;
            color: #ffd966;
        }
        body.theme-stardew #pin-code {
            background-color: #f3e5c2;
            border-color: #8c5826;
            color: #3e2410;
        }
        body.theme-stardew button.main-btn {
            background-color: #8c5826;
            border-color: #ffd966;
            color: #f7ebd2;
        }
        body.theme-stardew .secondary-btn {
            background-color: #3d281a !important;
            border-color: #8c5826 !important;
            color: #dfc8a8 !important;
        }
        body.theme-stardew #sleep-screen {
            background: radial-gradient(circle, #382516 0%, #170f08 100%);
        }
        body.theme-stardew .crown-core { color: #ffd966; }
        body.theme-stardew .ritual-ring {
            border-color: #8c5826;
            box-shadow: 0 0 18px rgba(140, 88, 38, 0.4);
        }
        body.theme-stardew #dashboard {
            background-color: #2b1c12;
            background-image: 
                radial-gradient(circle at center, transparent 40%, #170f08 100%),
                radial-gradient(#4d3221 1px, transparent 1px);
        }
        body.theme-stardew .cult-card {
            background-color: #f3e5c2;
            border: 2px solid #8c5826;
            color: #3e2410;
            box-shadow: 
                inset 0 0 0 2px #d8c49d,
                0 3px 6px rgba(0, 0, 0, 0.4);
        }
        body.theme-stardew .cult-card::before, body.theme-stardew .cult-card::after {
            color: #8c5826;
        }
        body.theme-stardew .card-header {
            color: #5a3418;
            font-weight: bold;
        }
        body.theme-stardew .card-value {
            color: #3e2410;
            font-weight: bold;
        }
        body.theme-stardew .bar-track {
            background-color: #d8c49d;
            border-color: #8c5826;
        }
        body.theme-stardew .card-launcher {
            background-color: #e6d3a5;
            border: 2px solid #b87333;
        }
        body.theme-stardew .card-launcher:active {
            background-color: #c9b483;
        }
        body.theme-stardew .card-spotify {
            background-color: #e8dbb7;
            border-color: #2e7d32;
        }
        body.theme-stardew .card-spotify .card-header { color: #2e7d32; }
        body.theme-stardew .spotify-track { color: #3e2410; }
        body.theme-stardew .spotify-btn, body.theme-stardew .vol-btn {
            background-color: #d8c49d;
            border-color: #8c5826;
            color: #3e2410;
        }

        /* --- СТИЛИ ДЛЯ ТЕМЫ TWILIGHT (MODERN DARK) --- */
        body.theme-twilight {
            background-color: #191722;
            color: #e6e4f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body.theme-twilight #setup {
            background: radial-gradient(circle, #272238 0%, #13111c 100%);
        }
        body.theme-twilight #setup h2 {
            color: #9b72f3;
            text-shadow: 0 2px 8px rgba(155, 114, 243, 0.4);
        }
        body.theme-twilight #detected-host {
            background-color: #23202e;
            border-color: #3b354d;
            color: #9b72f3;
        }
        body.theme-twilight #pin-code {
            background-color: #23202e;
            border-color: #9b72f3;
            color: #9b72f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body.theme-twilight button.main-btn {
            background-color: #2e2a3d;
            border-color: #9b72f3;
            color: #e6e4f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body.theme-twilight .secondary-btn {
            background-color: #201d2b !important;
            border-color: #3b354d !important;
            color: #a5a1b8 !important;
        }
        body.theme-twilight #sleep-screen {
            background: radial-gradient(circle, #231f33 0%, #0e0d14 100%);
        }
        body.theme-twilight .crown-core { color: #9b72f3; }
        body.theme-twilight .ritual-ring {
            border-color: #9b72f3;
            box-shadow: 0 0 18px rgba(155, 114, 243, 0.35);
        }
        body.theme-twilight #dashboard {
            background-color: #15131c;
            background-image: 
                radial-gradient(circle at center, transparent 40%, #0d0c12 100%),
                radial-gradient(#2d283d 1px, transparent 1px);
        }
        body.theme-twilight .cult-card {
            background-color: #23202e;
            border: 2px solid #3b354d;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        body.theme-twilight .cult-card::before, body.theme-twilight .cult-card::after {
            display: none;
        }
        body.theme-twilight .card-header {
            color: #a5a1b8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body.theme-twilight .card-value {
            color: #e6e4f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body.theme-twilight .card-cpu { border-color: #f45b84; }
        body.theme-twilight .card-cpu .card-header { color: #f45b84; }
        body.theme-twilight .card-ram { border-color: #9b72f3; }
        body.theme-twilight .card-ram .card-header { color: #9b72f3; }
        body.theme-twilight .card-disk { border-color: #5299f0; }
        body.theme-twilight .card-disk .card-header { color: #5299f0; }
        body.theme-twilight .fill-cpu { background: #f45b84; }
        body.theme-twilight .fill-ram { background: #9b72f3; }
        body.theme-twilight .fill-disk { background: #5299f0; }
        body.theme-twilight .card-launcher {
            background-color: #2a2538;
            border-color: #f45b84;
        }
        body.theme-twilight .card-launcher:active {
            background-color: #3d3254;
        }
    </style>
</head>
<body>

<div id="setup">
    <h2>♛ АЛТАРЬ СИСТЕМЫ ♛</h2>
    <p>Введите 4-значный PIN-код из окна программы:</p>
    <div id="detected-host">Сервер: определение...</div>
    <div class="input-row">
        <input type="text" id="pin-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN">
    </div>
    <button class="main-btn" onclick="connect()">Призвать панель</button>
    <br>
    <button class="main-btn secondary-btn" id="fs-btn" onclick="openFullscreen()">На весь экран</button>
    <div id="status" style="margin-top: 10px; color: #ff5555; font-size: 13px; padding: 0 10px;"></div>
</div>

<!-- Экран ожидания при выключении ПК -->
<div id="sleep-screen">
    <div style="position: relative; width: 150px; height: 150px; margin: 0 auto 15px auto;">
        <div class="ritual-ring"></div>
        <div class="crown-core">♛</div>
    </div>
    <div class="sleep-title">Алтарь дремлет</div>
    <div class="sleep-sub">Ожидание пробуждения главного ПК...</div>
    <div class="sleep-clock" id="sleep-clock">--:--:--</div>
</div>

<div id="dashboard-wrapper">
    <div id="dashboard"></div>
</div>

<script>
    var socket;
    var activeTimers = [];
    // Автоматически берем IP из адресной строки браузера
    var currentPcIp = window.location.hostname || "127.0.0.1";
    var wasAuthenticated = false;
    var reconnectTimer = null;
    var canvasW = 640;
    var canvasH = 360;
    var notifyHideTimer = null;
    var notifyBadgeSide = 90;

    var currentTheme = "cult";
    var currentThemeTitles = null;
    var currentTranslations = null;

    function applyTheme(theme) {
        if (!theme) theme = 'cult';
        currentTheme = theme;

    window.onload = function() {
        document.getElementById('detected-host').innerText = "Сервер: " + currentPcIp;

        var urlPin = null;
        try {
            var search = window.location.search;
            if (search) {
                var pinMatch = search.match(/[?&]pin=([0-9a-zA-Z]{4})/);
                if (pinMatch && pinMatch[1]) {
                    urlPin = pinMatch[1];
                }
            }
        } catch (e) {}

        if (urlPin) {
            var pinInput = document.getElementById('pin-code');
            if (pinInput) {
                pinInput.value = urlPin;
            }
            setTimeout(function() {
                connect();
            }, 300);
        } else {
            try {
                var savedPin = localStorage.getItem('cult_pc_pin');
                if (savedPin) {
                    document.getElementById('pin-code').value = savedPin;
                }
            } catch (e) {}
        }

        // Разрешаем отправку по клавише Enter / Готово на клавиатуре телефона
        document.getElementById('pin-code').addEventListener('keyup', function(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                connect();
            }
        });

        var sleepClockEl = document.getElementById('sleep-clock');
        var lastSleepTime = "";
        function tickSleepClock() {
            if (document.getElementById('sleep-screen').style.display === 'block') {
                var t = getFormattedTime();
                if (t !== lastSleepTime) {
                    lastSleepTime = t;
                    sleepClockEl.innerText = t;
                }
            }
        }
        sleepClockEl.innerText = getFormattedTime();
        setInterval(tickSleepClock, 1000);
    };

    function fitCanvasToScreen() {
        var dash = document.getElementById('dashboard');
        dash.style.width = canvasW + 'px';
        dash.style.height = canvasH + 'px';

        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var scaleX = vw / canvasW;
        var scaleY = vh / canvasH;
        var scale = Math.min(scaleX, scaleY);

        var offsetX = Math.floor((vw - canvasW * scale) / 2);
        var offsetY = Math.floor((vh - canvasH * scale) / 2);

        dash.style.left = offsetX + 'px';
        dash.style.top = offsetY + 'px';
        dash.style.transform = 'scale(' + scale + ') translateZ(0)';
        dash.style.webkitTransform = 'scale(' + scale + ') translateZ(0)';
    }

    function openFullscreen() {
        var elem = document.documentElement;
        var statusDiv = document.getElementById('status');

        if (elem.requestFullscreen) {
            elem.requestFullscreen();
            setTimeout(fitCanvasToScreen, 300);
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
            setTimeout(fitCanvasToScreen, 300);
        } else {
            // Для iPhone Safari (где requestFullscreen отключен Apple)
            window.scrollTo(0, 1);
            statusDiv.style.color = "#e6b800";
            statusDiv.innerText = "На iPhone нажмите внизу «Поделиться» (↑) → «На экран «Домой»», чтобы открыть без рамок Safari.";
        }
    }

    function triggerNotificationOmen(appType) {
        var overlay = document.getElementById('notify-overlay');
        if (!overlay) return;

        var iconSvg = OMEN_ICONS[appType] || OMEN_ICONS.telegram;
        overlay.innerHTML = '<div class="omen-badge omen-' + appType + '" style="width:' + notifyBadgeSide + 'px; height:' + notifyBadgeSide + 'px;">' + iconSvg + '</div>';

        overlay.className = '';
        void overlay.offsetWidth;

        notifyHideTimer = setTimeout(function() {

    function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = setTimeout(function() {
            reconnectTimer = null;
            connect(true);
        }, 3000);
    }

    function connect(isAutoRetry) {
        var pin = document.getElementById('pin-code').value.trim();
        var statusDiv = document.getElementById('status');
        
        if (!pin) {
            if (!isAutoRetry) {
                statusDiv.style.color = "#ff5555";
                statusDiv.innerText = "Введите 4-значный PIN-код!";
            }
            return;
        }

        if (!isAutoRetry) {
            statusDiv.style.color = "#b8ad9e";
            statusDiv.innerText = "Проверка печати доступа...";
        }

        try {
            socket = new WebSocket("ws://" + currentPcIp + ":8765");

            socket.onopen = function() {
                socket.send(JSON.stringify({ action: "auth", pin: pin }));
            };

            socket.onmessage = function(event) {
                var data = JSON.parse(event.data);
                
                if (data.action === "auth_ok") {
                    wasAuthenticated = true;
                    try {
                        localStorage.setItem('cult_pc_pin', pin);
                    } catch (e) {}

                    if (data.theme) applyTheme(data.theme);
                    if (data.translations) applyTranslations(data.translations, data.theme_titles);

                    document.getElementById('setup').style.display = 'none';
                    document.getElementById('sleep-screen').style.display = 'none';
                    document.getElementById('dashboard-wrapper').style.display = 'block';
                    fitCanvasToScreen();
                }
                else if (data.action === "auth_fail") {
                    wasAuthenticated = false;
                    document.getElementById('sleep-screen').style.display = 'none';
                    document.getElementById('dashboard-wrapper').style.display = 'none';
                    document.getElementById('setup').style.display = 'block';
                    statusDiv.style.color = "#ff5555";
                    var failMsg = (currentTranslations && currentTranslations.bad_pin) ? currentTranslations.bad_pin : "Неверный PIN-код! Доступ отвергнут.";
                    statusDiv.innerText = failMsg;
                }
                else if (data.action === "set_theme") {
                    if (data.theme) applyTheme(data.theme);
                    if (data.theme_titles) {
                        currentThemeTitles = data.theme_titles;
                        updateWidgetTitles(data.theme_titles);
                    }
                }
                else if (data.action === "set_language") {
                    if (data.theme) applyTheme(data.theme);
                    if (data.translations) applyTranslations(data.translations, data.theme_titles);
                }
                else if (data.action === "update_layout") {
                    if (data.theme) applyTheme(data.theme);
                    if (data.theme_titles) currentThemeTitles = data.theme_titles;
                    if (data.screen_w) canvasW = data.screen_w;
                    if (data.screen_h) canvasH = data.screen_h;
                    fitCanvasToScreen();
                    renderWidgets(data.widgets);
                }
                else if (data.action === "telemetry") {
                    updateTelemetry(data);
                }
                else if (data.action === "notify") {
                    triggerNotificationOmen(data.app);
                }
            };

            socket.onclose = function() {
                if (wasAuthenticated) {
                    document.getElementById('dashboard-wrapper').style.display = 'none';
                    document.getElementById('sleep-screen').style.display = 'block';
                    scheduleReconnect();
                } else if (!isAutoRetry) {
                    statusDiv.style.color = "#ff5555";
                    statusDiv.innerText = "Не удалось соединиться с сервером (" + currentPcIp + ").";
                }
            };

            socket.onerror = function() {};
        } catch(e) {
            if (!isAutoRetry) {
                statusDiv.innerText = "Ошибка: " + e.message;
            } else {
                scheduleReconnect();
            }
        }
    }

    function applyCardDimensions(card, w) {
        if (w.w) card.style.width = w.w + 'px';
        if (w.h) card.style.height = w.h + 'px';

        var h = w.h || 85;
        var header = card.querySelector('.card-header');
        var val = card.querySelector('.card-value');
        var bar = card.querySelector('.bar-track');
        var track = card.querySelector('.spotify-track');
        var btns = card.querySelectorAll('.mini-btn');

        if (header) {
            var titlePx = Math.max(9, Math.min(18, Math.round(h * 0.12)));
            header.style.fontSize = titlePx + 'px';
        }
        if (val) {
            var factor = (w.type === "launcher") ? 0.25 : 0.30;
            var valPx = Math.max(15, Math.min(48, Math.round(h * factor)));
            val.style.fontSize = valPx + 'px';
        }
        if (track) {
            var trPx = Math.max(11, Math.min(20, Math.round(h * 0.14)));
            track.style.fontSize = trPx + 'px';
        }
        if (btns && btns.length > 0) {
            var btnPx = Math.max(12, Math.min(26, Math.round(h * 0.20)));
            for (var i = 0; i < btns.length; i++) {
                btns[i].style.fontSize = btnPx + 'px';
            }
        }
        if (bar) {
            var barH = Math.max(6, Math.round(h * 0.09));
            bar.style.height = barH + 'px';
        }
    }

    function updateTelemetry(data) {
        var cpuInt = Math.round(data.cpu);
        if (cpuInt !== lastMetrics.cpu) {
            lastMetrics.cpu = cpuInt;
            for (var i = 0; i < domCache.cpuVals.length; i++) {
                domCache.cpuVals[i].innerText = cpuInt + '%';
                domCache.cpuBars[i].style.width = cpuInt + '%';
            }
        }

        var ramInt = Math.round(data.ram);
        if (ramInt !== lastMetrics.ram) {
            lastMetrics.ram = ramInt;
            for (var j = 0; j < domCache.ramVals.length; j++) {
                domCache.ramVals[j].innerText = ramInt + '%';
                domCache.ramBars[j].style.width = ramInt + '%';
            }
        }

        var diskInt = Math.round(data.disk);
        if (diskInt !== lastMetrics.disk) {
            lastMetrics.disk = diskInt;
            for (var k = 0; k < domCache.diskVals.length; k++) {
                domCache.diskVals[k].innerText = diskInt + '%';
                domCache.diskBars[k].style.width = diskInt + '%';
            }
        }

        if (data.uptime !== lastMetrics.uptime) {
            lastMetrics.uptime = data.uptime;
            for (var m = 0; m < domCache.uptimeVals.length; m++) {
                domCache.uptimeVals[m].innerText = data.uptime;
            }
        }

        if (data.spotify !== lastMetrics.spotify) {
            lastMetrics.spotify = data.spotify;
            for (var n = 0; n < domCache.spotVals.length; n++) {
                domCache.spotVals[n].innerText = data.spotify;
            }
        }
    }

    function getFormattedTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        var s = now.getSeconds();
        if (h < 10) h = '0' + h;
        if (m < 10) m = '0' + m;
        if (s < 10) s = '0' + s;
        return h + ':' + m + ':' + s;
    }
</script>
